<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1a5f3f">
  <title>Mora Hamburguesas — Panel Admin</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- PANTALLA DE LOGIN -->
<div id="loginScreen" class="login-screen">
  <div class="login-container">
    <div class="login-header">
      <div class="brand-mark">M</div>
      <h1>Mora Hamburguesas</h1>
      <p>Panel de Administración</p>
    </div>
    
    <form id="loginForm" class="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="user">Usuario</label>
        <input id="user" type="text" placeholder="........" required>
      </div>
      
      <div class="form-group">
        <label for="pass">Contraseña</label>
        <input id="pass" type="password" placeholder="........" required>
      </div>
      
      <button type="submit" class="btn btn-primary btn-block">Entrar</button>
    </form>
    
    <p class="login-note">Solo administrador</p>
  </div>
</div>

<!-- PANTALLA DE ADMIN (OCULTA HASTA LOGIN) -->
<div id="adminScreen" style="display: none;">
  <header class="site-header">
    <div class="brand">
      <div class="brand-mark">M</div>
      <div class="brand-text"><strong>MORA</strong><span>HAMBURGUESAS · PANEL ADMIN</span></div>
    </div>
    <button id="logoutBtn" class="btn btn-outline small">Cerrar sesión</button>
  </header>

  <main class="admin-main">
    <div class="admin-container">
      <h2>Panel de Control</h2>
      
      <div class="admin-tabs">
        <button class="tab-btn active" data-tab="business">Negocio</button>
        <button class="tab-btn" data-tab="products">Productos</button>
        <button class="tab-btn" data-tab="zones">Zonas</button>
        <button class="tab-btn" data-tab="webhook">Google Sheets</button>
        <button class="tab-btn" data-tab="orders">Pedidos</button>
      </div>

      <div id="tabContent" class="tab-content"></div>
    </div>
  </main>
</div>

<div id="toast" class="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
